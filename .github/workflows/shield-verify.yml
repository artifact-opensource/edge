name: Shield Verify

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Find latest backup
        id: find_backup
        run: |
          echo "BACKUP=$(ls backups/artifactvirtual-backup-*.zip | sort -r | head -n1)" >> $GITHUB_OUTPUT
      - name: Run verification
        env:
          SHIELD_PASSPHRASE: ${{ secrets.SHIELD_PASSPHRASE }}
        run: |
          BACKUP="${{ steps.find_backup.outputs.BACKUP }}"
          if [ -z "$BACKUP" ]; then echo "No backup found"; exit 1; fi
          python scripts/shield/verify_encrypted_files.py "$BACKUP" "$SHIELD_PASSPHRASE"
