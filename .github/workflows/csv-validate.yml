name: CSV Validation

on:
  push:
    paths:
      - 'docs/csv-manifest.json'
      - 'enterprise/**'
      - 'obsidian/**'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Run CSV validation
        run: |
          python scripts/validate_csvs.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: csv-validation-report
          path: reports/csv-validation-report.md
