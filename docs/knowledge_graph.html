<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Knowledge Graph - Interactive Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
        }

        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            max-width: 300px;
        }

        #controls h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00ff88;
            border-bottom: 2px solid #00ff88;
            padding-bottom: 8px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            width: 14px;
            height: 14px;
            background: #00ff88;
            cursor: pointer;
            border-radius: 50%;
        }

        .btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #00cc6f;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #333;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #444;
        }

        #stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            min-width: 200px;
        }

        #stats h3 {
            font-size: 14px;
            color: #00ff88;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            color: #fff;
            font-weight: 600;
        }

        #detail-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-height: 40vh;
            background: rgba(20, 20, 20, 0.98);
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            overflow-y: auto;
            padding: 20px;
        }

        #detail-panel.active {
            display: block;
        }

        #detail-panel h3 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h4 {
            color: #00ff88;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #00ff88;
        }

        .detail-item-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-item-value {
            font-size: 13px;
            color: #fff;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        .badge-success { background: #00ff88; color: #000; }
        .badge-warning { background: #ffaa00; color: #000; }
        .badge-danger { background: #ff4444; color: #fff; }
        .badge-info { background: #4488ff; color: #fff; }

        #graph-container {
            width: 100vw;
            height: 100vh;
        }

        .node {
            cursor: pointer;
            transition: all 0.2s;
        }

        .node:hover {
            stroke-width: 4px !important;
        }

        .link {
            stroke-opacity: 0.6;
            transition: all 0.2s;
        }

        .link:hover {
            stroke-opacity: 1;
            stroke-width: 3px;
        }

        .node-label {
            font-size: 11px;
            fill: #fff;
            pointer-events: none;
            text-anchor: middle;
            text-shadow: 0 0 3px #000, 0 0 5px #000;
        }

        .legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.95);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            z-index: 1000;
        }

        .legend h4 {
            font-size: 12px;
            color: #00ff88;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 8px;
            border: 2px solid #fff;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00cc6f;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h2>🎛️ Controls</h2>
        
        <div class="control-group">
            <label>Charge Strength</label>
            <input type="range" id="charge" min="-500" max="-50" value="-200" step="10">
            <span id="charge-value">-200</span>
        </div>

        <div class="control-group">
            <label>Link Distance</label>
            <input type="range" id="distance" min="50" max="300" value="150" step="10">
            <span id="distance-value">150</span>
        </div>

        <div class="control-group">
            <label>Node Size</label>
            <input type="range" id="nodeSize" min="5" max="30" value="12" step="1">
            <span id="size-value">12</span>
        </div>

        <div>
            <button class="btn" onclick="resetZoom()">Reset View</button>
            <button class="btn btn-secondary" onclick="toggleLabels()">Toggle Labels</button>
            <button class="btn btn-secondary" onclick="loadData()">Reload Data</button>
        </div>
    </div>

    <div id="stats">
        <h3>📊 Statistics</h3>
        <div class="stat-item">
            <span class="stat-label">Total Nodes:</span>
            <span class="stat-value" id="total-nodes">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Total Links:</span>
            <span class="stat-value" id="total-links">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Projects:</span>
            <span class="stat-value" id="project-count">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Documents:</span>
            <span class="stat-value" id="doc-count">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Stakeholders:</span>
            <span class="stat-value" id="stakeholder-count">0</span>
        </div>
    </div>

    <div class="legend">
        <h4>Node Types</h4>
        <div class="legend-item">
            <div class="legend-color" style="background: #00ff88;"></div>
            <span>Projects</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #4488ff;"></div>
            <span>Public Docs</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff8844;"></div>
            <span>Internal Docs</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff4488;"></div>
            <span>Stakeholders</span>
        </div>
    </div>

    <div id="detail-panel">
        <h3>
            <span id="detail-title">Node Details</span>
            <button class="close-btn" onclick="closeDetail()">✕</button>
        </h3>
        <div id="detail-content"></div>
    </div>

    <div id="graph-container"></div>

    <script>
        // Configuration
        const width = window.innerWidth;
        const height = window.innerHeight;
        let showLabels = true;

        // Color scheme
        const colors = {
            project: '#00ff88',
            public_doc: '#4488ff',
            internal_doc: '#ff8844',
            stakeholder: '#ff4488',
            community: '#aa44ff'
        };

        // Create SVG
        const svg = d3.select('#graph-container')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        // Add zoom behavior
        const g = svg.append('g');
        const zoom = d3.zoom()
            .scaleExtent([0.1, 10])
            .on('zoom', (event) => {
                g.attr('transform', event.transform);
            });
        
        svg.call(zoom);

        // Initialize simulation
        let simulation = d3.forceSimulation()
            .force('charge', d3.forceManyBody().strength(-200))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(30));

        let nodes = [];
        let links = [];
        let nodeElements, linkElements, labelElements;

        // Load and process data
        async function loadData() {
            // Helper: try multiple candidate locations for a filename
            async function fetchWithFallback(filename) {
                const base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
                const candidates = [
                    `data/${filename}`,
                    `${base}data/${filename}`,
                    `database/data/${filename}`,
                    `./data/${filename}`,
                    `../database/data/${filename}`,
                    filename
                ];

                for (const p of candidates) {
                    try {
                        const res = await fetch(p);
                        if (!res.ok) throw new Error(`HTTP ${res.status} for ${p}`);
                        console.info(`Loaded ${filename} from: ${p}`);
                        return await res.json();
                    } catch (e) {
                        console.warn(`Failed to fetch ${p}:`, e.message);
                    }
                }
                throw new Error(`Unable to fetch ${filename} from any known locations.`);
            }

            try {
                // Load all databases (with fallbacks)
                const [projectsData, publicData, internalData] = await Promise.all([
                    fetchWithFallback('projects_db.json'),
                    fetchWithFallback('public_db.json'),
                    fetchWithFallback('internal_db.json')
                ]);

                // Process data into nodes and links
                nodes = [];
                links = [];
                const nodeMap = new Map();

                // Add projects
                if (projectsData && projectsData.projects) {
                    projectsData.projects.forEach(project => {
                        const node = {
                            id: `project_${project.id}`,
                            type: 'project',
                            label: project.project_name,
                            data: project,
                            size: 15
                        };
                        nodes.push(node);
                        nodeMap.set(node.id, node);

                        // Create links based on relationships
                        if (project.related_projects) {
                            project.related_projects.forEach(relId => {
                                links.push({
                                    source: node.id,
                                    target: `project_${relId}`,
                                    type: 'project_relation'
                                });
                            });
                        }

                        // Link to documents - create targets for both public and internal doc namespaces so the filter later can resolve the correct one
                        if (project.related_documents) {
                            project.related_documents.forEach(docId => {
                                links.push({ source: node.id, target: `public_doc_${docId}`, type: 'document_relation' });
                                links.push({ source: node.id, target: `internal_doc_${docId}`, type: 'document_relation' });
                            });
                        }
                    });
                }

                // Add public documents
                if (publicData && publicData.public_documents) {
                    publicData.public_documents.forEach(doc => {
                        const node = {
                            id: `public_doc_${doc.id}`,
                            type: 'public_doc',
                            label: doc.title,
                            data: doc,
                            size: 10
                        };
                        nodes.push(node);
                        nodeMap.set(node.id, node);

                        // Link to related projects
                        if (doc.related_projects) {
                            doc.related_projects.forEach(projId => {
                                links.push({
                                    source: node.id,
                                    target: `project_${projId}`,
                                    type: 'document_relation'
                                });
                            });
                        }

                        // Link to related documents
                        if (doc.related_documents) {
                            doc.related_documents.forEach(relDocId => {
                                links.push({
                                    source: node.id,
                                    target: `public_doc_${relDocId}`,
                                    type: 'document_relation'
                                });
                            });
                        }
                    });
                }

                // Add internal documents
                if (internalData && internalData.internal_documents) {
                    internalData.internal_documents.forEach(doc => {
                        const node = {
                            id: `internal_doc_${doc.id}`,
                            type: 'internal_doc',
                            label: doc.title,
                            data: doc,
                            size: 10
                        };
                        nodes.push(node);
                        nodeMap.set(node.id, node);

                        // Link to related projects
                        if (doc.related_projects) {
                            doc.related_projects.forEach(projId => {
                                links.push({
                                    source: node.id,
                                    target: `project_${projId}`,
                                    type: 'document_relation'
                                });
                            });
                        }

                        // Link to related documents
                        if (doc.related_documents) {
                            doc.related_documents.forEach(relDocId => {
                                links.push({
                                    source: node.id,
                                    target: `internal_doc_${relDocId}`,
                                    type: 'document_relation'
                                });
                            });
                        }
                    });
                }

                // Add stakeholders
                if (publicData && publicData.stakeholders) {
                    publicData.stakeholders.forEach(stakeholder => {
                        const node = {
                            id: `stakeholder_${stakeholder.id}`,
                            type: 'stakeholder',
                            label: stakeholder.name,
                            data: stakeholder,
                            size: 12
                        };
                        nodes.push(node);
                        nodeMap.set(node.id, node);

                        // Link to related projects
                        if (stakeholder.related_projects) {
                            stakeholder.related_projects.forEach(projId => {
                                links.push({
                                    source: node.id,
                                    target: `project_${projId}`,
                                    type: 'stakeholder_relation'
                                });
                            });
                        }
                    });
                }

                // Debug: report how many links are unresolved before filtering
                const beforeFilter = links.length;

                // Filter valid links (both nodes exist)
                links = links.filter(link => nodeMap.has(link.source) && nodeMap.has(link.target));

                const removed = beforeFilter - links.length;
                if (removed > 0) console.info(`Filtered out ${removed} invalid links`);

                // Update statistics
                updateStats();

                // Render graph
                renderGraph();

            } catch (error) {
                console.error('Error loading data:', error);
                alert('Error loading database files. Make sure data files exist in database/data/.\nDetails: ' + (error && error.message ? error.message : error));
            }
        }

        function renderGraph() {
            // Clear existing elements
            g.selectAll('*').remove();

            // Create links
            linkElements = g.append('g')
                .selectAll('line')
                .data(links)
                .enter()
                .append('line')
                .attr('class', 'link')
                .attr('stroke', '#444')
                .attr('stroke-width', 2);

            // Create nodes
            nodeElements = g.append('g')
                .selectAll('circle')
                .data(nodes)
                .enter()
                .append('circle')
                .attr('class', 'node')
                .attr('r', d => d.size)
                .attr('fill', d => colors[d.type] || '#888')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2)
                .on('click', showNodeDetails)
                .call(d3.drag()
                    .on('start', dragStarted)
                    .on('drag', dragged)
                    .on('end', dragEnded));

            // Create labels
            labelElements = g.append('g')
                .selectAll('text')
                .data(nodes)
                .enter()
                .append('text')
                .attr('class', 'node-label')
                .text(d => d.label)
                .attr('dy', d => d.size + 15);

            // Update simulation
            simulation.nodes(nodes).on('tick', ticked);
            simulation.force('link', d3.forceLink(links).id(d => d.id).distance(150));
            simulation.alpha(1).restart();
        }

        function ticked() {
            linkElements
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            nodeElements
                .attr('cx', d => d.x)
                .attr('cy', d => d.y);

            labelElements
                .attr('x', d => d.x)
                .attr('y', d => d.y);
        }

        function dragStarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragEnded(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        function showNodeDetails(event, d) {
            const panel = document.getElementById('detail-panel');
            const content = document.getElementById('detail-content');
            const title = document.getElementById('detail-title');

            title.textContent = d.label;
            
            let html = '';

            // Basic info
            html += '<div class="detail-section">';
            html += '<h4>Basic Information</h4>';
            html += '<div class="detail-grid">';
            
            Object.entries(d.data).forEach(([key, value]) => {
                if (key !== 'content' && key !== 'description' && value !== null && value !== undefined && value !== '') {
                    html += `<div class="detail-item">`;
                    html += `<div class="detail-item-label">${key.replace(/_/g, ' ')}</div>`;
                    
                    if (Array.isArray(value)) {
                        html += `<div class="detail-item-value">`;
                        value.forEach(v => {
                            html += `<span class="badge badge-info">${v}</span>`;
                        });
                        html += `</div>`;
                    } else if (typeof value === 'object') {
                        html += `<div class="detail-item-value">${JSON.stringify(value)}</div>`;
                    } else {
                        html += `<div class="detail-item-value">${value}</div>`;
                    }
                    
                    html += `</div>`;
                }
            });
            
            html += '</div>';
            html += '</div>';

            content.innerHTML = html;
            panel.classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detail-panel').classList.remove('active');
        }

        function updateStats() {
            document.getElementById('total-nodes').textContent = nodes.length;
            document.getElementById('total-links').textContent = links.length;
            document.getElementById('project-count').textContent = nodes.filter(n => n.type === 'project').length;
            document.getElementById('doc-count').textContent = nodes.filter(n => n.type === 'public_doc' || n.type === 'internal_doc').length;
            document.getElementById('stakeholder-count').textContent = nodes.filter(n => n.type === 'stakeholder').length;
        }

        function resetZoom() {
            svg.transition().duration(750).call(
                zoom.transform,
                d3.zoomIdentity
            );
        }

        function toggleLabels() {
            showLabels = !showLabels;
            labelElements.style('display', showLabels ? 'block' : 'none');
        }

        // Control event listeners
        document.getElementById('charge').addEventListener('input', (e) => {
            const value = +e.target.value;
            document.getElementById('charge-value').textContent = value;
            simulation.force('charge').strength(value);
            simulation.alpha(1).restart();
        });

        document.getElementById('distance').addEventListener('input', (e) => {
            const value = +e.target.value;
            document.getElementById('distance-value').textContent = value;
            simulation.force('link').distance(value);
            simulation.alpha(1).restart();
        });

        document.getElementById('nodeSize').addEventListener('input', (e) => {
            const value = +e.target.value;
            document.getElementById('size-value').textContent = value;
            nodeElements.attr('r', d => d.size * value / 12);
        });

        // Initial load
        loadData();
    </script>
</body>
</html>
